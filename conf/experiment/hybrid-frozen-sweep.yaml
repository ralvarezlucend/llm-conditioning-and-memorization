# @package _global_

defaults:
  - /train
  - override /hydra/launcher: ray
  - _self_

hydra:
  sweeper:
    params:
      dataset: hybrid
      model.freeze_embeddings_from_gpt2: true,false
      dataset.token_subset_size: 10,100,10000
      dataset.total_size: 1000
      training.learning_rate: 9e-05
      training.batch_size: 64
      training.max_steps: 10000
      training.wandb_project: "llm-memorization"
      training.wandb_tags: "[plot-frozen-sweep]"
